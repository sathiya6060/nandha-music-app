<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/nandha-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- CSP fallback (M9): mirrors public/_headers so the app still has
         a CSP if _headers is ever lost (e.g. a non-wrangler deploy).
         frame-ancestors is omitted — it is ignored in a meta CSP.
         script-src keeps 'unsafe-inline' because the inline boot-guard
         script below (and its inline onclick Reload button) would be
         blocked without it; that script is a static hardcoded string
         with no user data, so the inline allowance is the same trade-off
         _headers already makes. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https://*.supabase.co blob:; connect-src 'self' https://*.supabase.co https://*.upstash.io; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="theme-color" content="#1E293B" />
    <meta name="description" content="Nandha Music — Official Tamil Music Label. Love, Devotional, Melody. Stream Vaazhvinil Orumurayenum and the Nandha Music catalog. YOUR BEAT. YOUR ECHO." />
    <meta property="og:title" content="Nandha Music — YOUR BEAT. YOUR ECHO." />
    <meta property="og:description" content="Official Tamil Music Label | Love • Devotional • Melody | Stream Vaazhvinil Orumurayenum now." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nandhamusic.pages.dev/" />
    <meta property="og:site_name" content="Nandha Music" />
    <meta property="og:image" content="https://nandhamusic.pages.dev/assets/nandha-og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nandha Music — YOUR BEAT. YOUR ECHO." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nandha Music — YOUR BEAT. YOUR ECHO." />
    <meta name="twitter:description" content="Official Tamil Music Label | Love • Devotional • Melody" />
    <meta name="twitter:image" content="https://nandhamusic.pages.dev/assets/nandha-og.jpg" />
    <meta name="twitter:image:alt" content="Nandha Music — YOUR BEAT. YOUR ECHO." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/nandha-logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Nandha Music — YOUR BEAT. YOUR ECHO.</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot guard: if React has not mounted after 8s, the page would
         otherwise sit blank (dark background only). Show a visible,
         brand-coloured fallback with a Reload button instead. A successful
         React mount wipes this automatically, and normal loads mount in
         well under 8s, so it never flashes on a healthy load. -->
    <script>
      (function () {
        function bootCheck() {
          setTimeout(function () {
            var root = document.getElementById('root')
            if (root && !root.hasChildNodes()) {
              root.innerHTML =
                '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#1E293B;color:#FEF3C7;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box">' +
                '<div style="font-size:20px;font-weight:700">Nandha Music is taking too long to load</div>' +
                '<div style="font-size:14px;opacity:.85">Please check your connection and try again.</div>' +
                '<button type="button" onclick="window.location.reload()" style="background:#F59E0B;color:#1E293B;border:0;border-radius:999px;padding:12px 28px;font-size:16px;font-weight:700;cursor:pointer;min-height:44px">Reload</button>' +
                '</div>'
            }
          }, 8000)
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', bootCheck)
        } else {
          bootCheck()
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
